version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: omnistock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnistock_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnistock_secret_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-omnistock_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omnistock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnistock_admin} -d ${POSTGRES_DB:-omnistock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Auth Service: Bun + Hono + Better Auth
  # ==========================================
  auth-service:
    build:
      context: ./omnistock-auth-service
      dockerfile: Dockerfile
    container_name: omnistock-auth-service
    restart: unless-stopped
    environment:
      PORT: ${AUTH_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://omnistock_admin:omnistock_secret_2026!@postgres:5432/omnistock_db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-uL9wK3pQ8vM2xZ7jN5bT1sR4yC6eA0dF8gH2jK4mP6qS8uV1xY3zB5dG7iJ9lO}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      JWT_ISSUER: ${JWT_ISSUER:-omnistock-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-omnistock-core-service}
    ports:
      - "${AUTH_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnistock-network

  # ==========================================
  # Core Service: Java Spring Boot 3
  # ==========================================
  core-service:
    build:
      context: ./omnistock-core-backend
      dockerfile: Dockerfile
    container_name: omnistock-core-service
    restart: unless-stopped
    environment:
      SERVER_PORT: ${CORE_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-omnistock_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-omnistock_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-omnistock_secret_2026!}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      AUTH_SERVICE_JWT_SECRET: ${BETTER_AUTH_SECRET:-uL9wK3pQ8vM2xZ7jN5bT1sR4yC6eA0dF8gH2jK4mP6qS8uV1xY3zB5dG7iJ9lO}
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnistock-network

  # ==========================================
  # Frontend: Angular 19 SPA
  # ==========================================
  frontend:
    build:
      context: ./omnistock-frontend
      dockerfile: Dockerfile
    container_name: omnistock-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - auth-service
      - core-service
    networks:
      - omnistock-network

volumes:
  postgres_data:
    driver: local

networks:
  omnistock-network:
    driver: bridge
